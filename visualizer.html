<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Mugs 11oz Visualiser</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--ink:#18212f;--muted:#667085;--line:#d9dee8;--panel:#ffffff;--paper:#f5f3ee;--green:#0f766e;--coral:#c2410c;--gold:#b7791f;--shadow:0 18px 45px rgba(24,33,47,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fbfaf7 0%,#eef2f6 100%);letter-spacing:0}
button,label.upload,select,input{font:inherit}
button,label.upload,select{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{min-height:40px;padding:9px 11px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,background .15s ease}
button:hover,label.upload:hover{border-color:#8da0b8;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.primary,label.upload.primary{background:var(--green);border-color:var(--green);color:#fff}
button.accent{background:var(--coral);border-color:var(--coral);color:#fff}
select{width:100%;min-height:42px;padding:8px 10px}
.shell{width:min(1240px,calc(100vw - 32px));margin:0 auto;padding:20px 0 26px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}
h1{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.02;font-weight:780}
.sub{margin:7px 0 0;color:var(--muted);max-width:720px;line-height:1.45}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.stage-wrap{min-width:0}
.stage{height:min(62vh,620px);min-height:460px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;background:var(--paper);touch-action:none;box-shadow:var(--shadow)}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:7px 10px;border:1px solid rgba(24,33,47,.12);border-radius:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);font-size:13px;color:#344054}
.zoom{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-weight:700}
.toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.toolbar button[aria-pressed="true"]{border-color:var(--green);background:#e7f3f1;color:#0b5f59}
.side{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;background:rgba(255,255,255,.88);box-shadow:0 8px 22px rgba(24,33,47,.06)}
.card h2{font-size:15px;line-height:1.2;margin:0 0 10px;font-weight:760}
.muted{color:var(--muted);font-size:13px;line-height:1.35}
.upload{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:8px;padding:9px 11px;cursor:pointer;text-align:center}
.file-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.range{margin:12px 0}
.range label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:13px;color:#344054}
.range output{font-variant-numeric:tabular-nums;color:var(--muted)}
.range input{width:100%;accent-color:var(--green)}
.tog{display:flex;align-items:center;gap:9px;color:#344054;font-size:14px}
.tog input{width:17px;height:17px;accent-color:var(--green)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hidden{display:none!important}
.shots-panel{margin-top:14px}
.shots-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.shots-head b{font-size:15px}
.shots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f4f4f4}
.shot div{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;font-size:13px}
.shot button{min-height:30px;padding:4px 8px}
.dropzone{display:grid;place-items:center;min-height:92px;border:1px dashed #9aa8ba;border-radius:8px;background:#fafafa;color:#344054;text-align:center;padding:12px;cursor:pointer}
.dropzone.drag{border-color:var(--green);background:#e7f3f1}
.proof img{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.status-dot{width:8px;height:8px;border-radius:99px;background:var(--gold);display:inline-block}
@media(max-width:920px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.stage{height:560px}.topbar{align-items:flex-start;flex-direction:column}.actions{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.shell{width:min(100% - 20px,1240px);padding-top:12px}.topbar{gap:14px}.sub{font-size:16px;line-height:1.42}.stage{height:min(62dvh,520px);min-height:390px}.toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar button{min-height:48px;padding:8px 7px;line-height:1.2}.side{display:flex}.shots{grid-template-columns:repeat(2,minmax(0,1fr))}.hud{align-items:flex-start}.chip{max-width:calc(100% - 148px)}}
@media(max-width:420px){h1{font-size:clamp(32px,10vw,42px)}.actions{grid-template-columns:1fr 1fr}.actions #resetArt{grid-column:1/-1}.card{padding:12px}.file-row{grid-template-columns:1fr}.file-row .upload{width:100%;margin-top:4px}.dropzone{min-height:112px}.stage{height:min(58dvh,500px);min-height:360px}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar button{min-height:46px}.hud{left:10px;right:10px;top:10px}.chip{font-size:12px;max-width:calc(100% - 132px)}.icon-btn{width:38px;height:38px}.zoom{gap:6px}}
@media(max-width:360px){.shell{width:min(100% - 16px,1240px)}.sub{font-size:15px}.stage{height:min(56dvh,470px);min-height:330px}.actions{gap:7px}.actions button{padding-left:8px;padding-right:8px}.toolbar button{font-size:15px}.shots{grid-template-columns:1fr}}
@media(max-height:560px) and (orientation:landscape){.shell{padding-top:8px}.topbar{margin-bottom:10px}.stage{height:72dvh;min-height:300px}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.sub{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<div>
<a href="index.html" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:13px">&#8592; Back to site</a>
</div>
<div class="actions">
<button id="downloadView" class="primary">Download view</button>
<button id="saveProof" class="accent">Save 2D proof</button>
<button id="resetArt">Reset art</button>
</div>
</header>

<div class="grid">
<section class="stage-wrap" aria-label="3D mug preview">
<div id="stage" class="stage">
<canvas id="c"></canvas>
<div class="hud">
<div class="chip"><span class="status-dot"></span><span id="status">Ready for artwork</span></div>
<div class="zoom" aria-label="Zoom controls">
<button id="zi" class="icon-btn" title="Zoom in" aria-label="Zoom in">+</button>
<button id="zo" class="icon-btn" title="Zoom out" aria-label="Zoom out">-</button>
<button id="zr" class="icon-btn" title="Reset zoom" aria-label="Reset zoom">1:1</button>
</div>
</div>
</div>
<div class="toolbar" aria-label="View controls">
<button data-view="front" aria-pressed="true">Left side</button>
<button data-view="back" aria-pressed="false">Right side</button>
<button data-view="handle" aria-pressed="false">Handle side</button>
<button data-view="top" aria-pressed="false">Top</button>
<button id="spin" aria-pressed="false">360 view</button>
</div>
<div id="previewWrap" class="shots-panel hidden">
<div class="shots-head"><b>2D preview angles</b><button id="refresh">Refresh angles</button></div>
<div id="shots" class="shots"></div>
</div>
<div id="proofWrap" class="shots-panel proof hidden">
<div class="shots-head"><b>Customer 2D proof</b><button id="downloadProof">Download proof</button></div>
<img id="proofImg" alt="Left and right side mug proof">
</div>
</section>

<aside class="side" aria-label="Artwork controls">
<div class="card">
<h2>Artwork</h2>
<div class="file-row">
<div>
<b>Left side photo</b>
<div id="frontName" class="muted">No left side photo selected</div>
</div>
<label class="upload primary">Upload<input id="frontFile" type="file" accept="image/*" hidden></label>
</div>
<hr>
<div class="file-row">
<div>
<b>Right side photo</b>
<div id="backName" class="muted">No right side photo selected</div>
</div>
<label class="upload">Upload<input id="backFile" type="file" accept="image/*" hidden></label>
</div>
</div>

<div class="card">
<h2>Print layout</h2>
<select id="layout">
<option value="front">Left side only</option>
<option value="frontBack" selected>Left and right sides</option>
<option value="wide">Wide wrap</option>
<option value="max">Maximum wrap, clear of handle</option>
</select>
<div id="area" class="muted" style="margin-top:8px"></div>
<label class="tog" style="margin-top:12px"><input id="guide" type="checkbox"> Show printable area</label>
</div>

<div id="controls" class="card hidden">
<h2>Positioning</h2>
<div class="actions" style="grid-template-columns:1fr 1fr 1fr"><button id="fitLeft" type="button">Fit</button><button id="fillLeft" type="button">Fill</button><button id="centerLeft" type="button">Center</button></div>
<div class="range"><label for="fs">Left side scale <output id="fsv">90%</output></label><input id="fs" type="range" min="10" max="300" value="90"></div>
<div class="range"><label for="fx">Left side left/right <output id="fxv">0</output></label><input id="fx" type="range" min="-700" max="700" value="0"></div>
<div class="range"><label for="fy">Left side up/down <output id="fyv">0</output></label><input id="fy" type="range" min="-440" max="440" value="0"></div>
<div id="backControls" class="hidden">
<hr>
<div class="actions" style="grid-template-columns:1fr 1fr 1fr"><button id="fitRight" type="button">Fit</button><button id="fillRight" type="button">Fill</button><button id="centerRight" type="button">Center</button></div>
<div class="range"><label for="bs">Right side scale <output id="bsv">90%</output></label><input id="bs" type="range" min="10" max="300" value="90"></div>
<div class="range"><label for="bx">Right side left/right <output id="bxv">0</output></label><input id="bx" type="range" min="-700" max="700" value="0"></div>
<div class="range"><label for="by">Right side up/down <output id="byv">0</output></label><input id="by" type="range" min="-440" max="440" value="0"></div>
</div>
</div>
<div class="card">
<h2>Production file</h2>
<label id="productionDrop" class="dropzone">Drop high-resolution file here<input id="productionFile" type="file" accept="image/*,.pdf,.ai,.psd,.tif,.tiff,.svg" hidden></label>
<div id="productionName" class="muted" style="margin-top:8px">No production file selected</div>
</div>
</aside>
</div>
</main>

<script type="module">
import * as THREE from './vendor/three.module.js';
const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('c');

// ---- WebGL capability check ----
let r;
try{
  r=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
}catch(err){
  stage.innerHTML='<div style="display:grid;place-items:center;height:100%;text-align:center;padding:24px;color:#c2410c;font-size:15px;line-height:1.5">WebGL is not available on this device or browser.<br>Try Chrome or Firefox on a desktop for the best experience.</div>';
  throw err;
}
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;

// ---- Context loss/restore ----
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('status').textContent='GPU context lost — please refresh the page'},false);
canvas.addEventListener('webglcontextrestored',()=>{try{build();redraw();$('status').textContent='Context restored'}catch(_){}},false);
const s=new THREE.Scene();s.background=new THREE.Color(0xf3f0e9);
const cam=new THREE.PerspectiveCamera(30,1,.1,50);let dist=8.2;cam.position.set(0,.18,dist);
const mug=new THREE.Group();s.add(mug);
const ceramic=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.18,clearcoat:.86,clearcoatRoughness:.06,metalness:0});
const innerMat=new THREE.MeshPhysicalMaterial({color:0xf6f6f4,roughness:.28,clearcoat:.62,clearcoatRoughness:.1,side:THREE.BackSide});
const shadowMat=new THREE.MeshBasicMaterial({color:0xd5d2cc,transparent:true,opacity:.34,side:THREE.DoubleSide,depthWrite:false});
const R=1.06,H=2.45,IR=.995;
const body=new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,224,1,true),ceramic);mug.add(body);
const bottom=new THREE.Mesh(new THREE.CircleGeometry(1.02,224),ceramic);bottom.rotation.x=-Math.PI/2;bottom.position.y=-H/2+.01;mug.add(bottom);
const basePlug=new THREE.Mesh(new THREE.CylinderGeometry(R*.98,R*.965,.095,224,1,false),ceramic);basePlug.position.y=-H/2+.035;mug.add(basePlug);
const iw=new THREE.Mesh(new THREE.CylinderGeometry(IR,IR,2.16,224,1,true),innerMat);iw.position.y=.08;mug.add(iw);
const ib=new THREE.Mesh(new THREE.CircleGeometry(IR,224),innerMat);ib.rotation.x=-Math.PI/2;ib.position.y=-1;mug.add(ib);
const rs=new THREE.Shape();rs.absarc(0,0,R,0,Math.PI*2,false);const rh=new THREE.Path();rh.absarc(0,0,IR,0,Math.PI*2,true);rs.holes.push(rh);
const rim=new THREE.Mesh(new THREE.ShapeGeometry(rs,128),ceramic);rim.rotation.x=-Math.PI/2;rim.position.y=H/2;mug.add(rim);
const rimLip=new THREE.Mesh(new THREE.TorusGeometry((R+IR)/2,(R-IR)*.36,24,224),ceramic);rimLip.rotation.x=Math.PI/2;rimLip.position.y=H/2+.01;mug.add(rimLip);
const footLip=new THREE.Mesh(new THREE.TorusGeometry(R*.96,.044,22,224),ceramic);footLip.rotation.x=Math.PI/2;footLip.position.y=-H/2+.048;mug.add(footLip);
const footShadow=new THREE.Mesh(new THREE.TorusGeometry(R*.9,.018,16,224),shadowMat);footShadow.rotation.x=Math.PI/2;footShadow.position.y=-H/2+.072;mug.add(footShadow);

const hp=[
new THREE.Vector3(.99,.74,0),new THREE.Vector3(1.16,.75,0),new THREE.Vector3(1.36,.75,0),
new THREE.Vector3(1.61,.67,0),new THREE.Vector3(1.84,.49,0),new THREE.Vector3(2.00,.24,0),
new THREE.Vector3(2.06,0,0),new THREE.Vector3(2.00,-.25,0),new THREE.Vector3(1.84,-.51,0),
new THREE.Vector3(1.61,-.69,0),new THREE.Vector3(1.35,-.76,0),new THREE.Vector3(1.16,-.75,0),
new THREE.Vector3(.99,-.73,0)];
const curve=new THREE.CatmullRomCurve3(hp,false,'centripetal',.45);
const handle=new THREE.Mesh(new THREE.TubeGeometry(curve,240,.108,32,false),ceramic);mug.add(handle);
function handleFillet(y){const fillet=new THREE.Mesh(new THREE.SphereGeometry(.13,40,24),ceramic);fillet.scale.set(.42,.9,.54);fillet.position.set(1.055,y,0);mug.add(fillet)}
handleFillet(.74);handleFillet(-.73);

function tex(){const c=document.createElement('canvas');c.width=1800;c.height=1200;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return{c,x:c.getContext('2d'),t}}
const ft=tex(),bt=tex(),wt=tex();
const fm=new THREE.MeshBasicMaterial({map:ft.t,transparent:true,depthWrite:false});
const bm=new THREE.MeshBasicMaterial({map:bt.t,transparent:true,depthWrite:false});
const wm=new THREE.MeshBasicMaterial({map:wt.t,transparent:true,depthWrite:false});
let fimg=null,bimg=null,showGuide=false,patches=[],proofUrl='',productionFile=null;
const mmToArc=mm=>(mm/258)*Math.PI*2;
const HANDLE_ANGLE=Math.PI/2;
const LEFT_SIDE_ANGLE=Math.PI;
const RIGHT_SIDE_ANGLE=0;
const WIDE_WRAP_ANGLE=HANDLE_ANGLE+Math.PI;
const LEFT_SIDE_VIEW_Y=Math.PI;
const RIGHT_SIDE_VIEW_Y=0;
const HANDLE_VIEW_Y=-Math.PI/2;
function clearP(){patches.forEach(m=>{m.geometry.dispose();mug.remove(m)});patches=[]}
function patch(center,arc,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(R+.006,R+.006,2.40,220,1,true,center-arc/2,arc),mat);mug.add(m);patches.push(m)}
function build(){clearP();const v=$('layout').value;if(v==='front'){patch(LEFT_SIDE_ANGLE,mmToArc(95),fm);$('area').textContent='Left side print area, clear of the handle'}if(v==='frontBack'){patch(LEFT_SIDE_ANGLE,mmToArc(95),fm);patch(RIGHT_SIDE_ANGLE,mmToArc(95),bm);$('area').textContent='Left and right side print areas; neither crosses the handle'}if(v==='wide'){patch(WIDE_WRAP_ANGLE,mmToArc(180),wm);$('area').textContent='Wide side wrap, about 180 mm, clear of the handle'}if(v==='max'){patch(WIDE_WRAP_ANGLE,mmToArc(232),wm);$('area').textContent='Maximum side wrap, about 232 mm, stretched closer to the handle with a no-print gap'}}
function drawOne(o,img,size,xo,yo){o.x.clearRect(0,0,o.c.width,o.c.height);if(showGuide){o.x.save();o.x.strokeStyle='rgba(15,118,110,.55)';o.x.setLineDash([22,16]);o.x.lineWidth=6;o.x.strokeRect(8,8,o.c.width-16,o.c.height-16);o.x.restore()}if(img){const sc=size/100,fit=Math.min((1500*sc)/img.width,(1150*sc)/img.height),w=img.width*fit,h=img.height*fit;o.x.drawImage(img,o.c.width/2-w/2+xo,o.c.height/2-h/2+yo,w,h)}o.t.needsUpdate=true}
function drawWrap(){wt.x.clearRect(0,0,wt.c.width,wt.c.height);if(showGuide){wt.x.save();wt.x.strokeStyle='rgba(15,118,110,.55)';wt.x.setLineDash([22,16]);wt.x.lineWidth=6;wt.x.strokeRect(8,8,wt.c.width-16,wt.c.height-16);wt.x.restore()}const draw=(img,left,size,xo,yo)=>{if(!img)return;const half=wt.c.width/2,sc=size/100,fit=Math.min((half*.92*sc)/img.width,(wt.c.height*.96*sc)/img.height),w=img.width*fit,h=img.height*fit,cx=left?half*.5:half*1.5;wt.x.drawImage(img,cx-w/2+xo*.45,wt.c.height/2-h/2+yo,w,h)};draw(fimg,true,+$('fs').value,+$('fx').value,+$('fy').value);draw(bimg,false,+$('bs').value,+$('bx').value,+$('by').value);wt.t.needsUpdate=true}
function updateValues(){['fs','fx','fy','bs','bx','by'].forEach(id=>{const o=$(id+'v');if(o)o.textContent=id.endsWith('s')?$(id).value+'%':$(id).value})}
function redraw(){updateValues();drawOne(ft,fimg,+$('fs').value,+$('fx').value,+$('fy').value);drawOne(bt,bimg,+$('bs').value,+$('bx').value,+$('by').value);drawWrap();$('status').textContent=fimg||bimg?'Artwork loaded':'Ready for artwork'}
function load(input,isFront){input.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Please select an image file (JPG, PNG, WEBP, etc.)');return}const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{if(isFront){fimg=im;$('frontName').textContent=file.name}else{bimg=im;$('backName').textContent=file.name;$('backControls').classList.remove('hidden')}$('controls').classList.remove('hidden');$('previewWrap').classList.remove('hidden');redraw();shots()};im.onerror=()=>{alert('Could not load image. The file may be corrupt or an unsupported format.')};im.src=fr.result};fr.onerror=()=>{alert('Could not read file. Please try again.')};fr.readAsDataURL(file)})}
load($('frontFile'),true);load($('backFile'),false);
['fs','fx','fy','bs','bx','by'].forEach(id=>$(id).addEventListener('input',redraw));
function setSide(side,mode){const ids=side==='left'?['fs','fx','fy']:['bs','bx','by'];if(mode==='fit')$(ids[0]).value=100;if(mode==='fill')$(ids[0]).value=132;if(mode==='center'){$(ids[1]).value=0;$(ids[2]).value=0}redraw();shots()}
$('fitLeft').onclick=()=>setSide('left','fit');$('fillLeft').onclick=()=>setSide('left','fill');$('centerLeft').onclick=()=>setSide('left','center');
$('fitRight').onclick=()=>setSide('right','fit');$('fillRight').onclick=()=>setSide('right','fill');$('centerRight').onclick=()=>setSide('right','center');
$('layout').addEventListener('change',()=>{build();redraw();shots()});
$('guide').addEventListener('change',e=>{showGuide=e.target.checked;redraw();shots()});
$('resetArt').onclick=()=>{fimg=null;bimg=null;productionFile=null;['frontFile','backFile','productionFile'].forEach(id=>$(id).value='');$('frontName').textContent='No left side photo selected';$('backName').textContent='No right side photo selected';$('productionName').textContent='No production file selected';$('backControls').classList.add('hidden');$('controls').classList.add('hidden');$('previewWrap').classList.add('hidden');$('proofWrap').classList.add('hidden');redraw()};
function setProductionFile(file){if(!file)return;productionFile=file;$('productionName').textContent=file.name+' ('+Math.round(file.size/1024)+' KB)'}
const drop=$('productionDrop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');setProductionFile(e.dataTransfer.files?.[0])});
$('productionFile').addEventListener('change',e=>setProductionFile(e.target.files?.[0]));

s.add(new THREE.HemisphereLight(0xffffff,0xcfc8bc,2.05));const key=new THREE.DirectionalLight(0xffffff,4.4);key.position.set(-3.5,5.2,5);s.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.35);fill.position.set(4,2,4);s.add(fill);const rimLight=new THREE.DirectionalLight(0xffffff,.9);rimLight.position.set(2.8,3,-4);s.add(rimLight);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.ShadowMaterial({opacity:.16}));floor.rotation.x=-Math.PI/2;floor.position.y=-H/2-.04;s.add(floor);
function zoom(v){dist=Math.max(3.6,Math.min(9.4,v));cam.position.z=dist;cam.updateProjectionMatrix()}
document.querySelector('.zoom').addEventListener('pointerdown',e=>e.stopPropagation());
document.querySelector('.zoom').addEventListener('pointermove',e=>e.stopPropagation());
document.querySelector('.zoom').addEventListener('click',e=>e.stopPropagation());
$('zi').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();zoom(dist-.9)});
$('zo').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();zoom(dist+.9)});
$('zr').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();zoom(8.2)});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(dist+(e.deltaY>0?.55:-.55))},{passive:false});
window.__mugZoom=()=>dist;
let ty=LEFT_SIDE_VIEW_Y,tx=-.08,drag=false,ox=0,oy=0,spinning=false;const p=new Map();let ps=0,pz=8.2;
function pd(){const a=[...p.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
stage.addEventListener('pointerdown',e=>{p.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch(_){}spinning=false;$('spin').setAttribute('aria-pressed','false');if(p.size===1){drag=true;ox=e.clientX;oy=e.clientY}if(p.size===2){ps=pd();pz=dist;drag=false}});
stage.addEventListener('pointermove',e=>{if(!p.has(e.pointerId))return;p.set(e.pointerId,{x:e.clientX,y:e.clientY});if(p.size===2){const d=pd();if(ps)zoom(pz*(ps/d));return}if(!drag)return;ty+=(e.clientX-ox)*.012;tx+=(e.clientY-oy)*.009;tx=Math.max(-.82,Math.min(.82,tx));ox=e.clientX;oy=e.clientY});
function end(e){p.delete(e.pointerId);if(!p.size)drag=false}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
function setPressed(btn){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{spinning=false;$('spin').setAttribute('aria-pressed','false');setPressed(b);const v=b.dataset.view;if(v==='front'){ty=LEFT_SIDE_VIEW_Y;tx=-.08}if(v==='back'){ty=RIGHT_SIDE_VIEW_Y;tx=-.08}if(v==='handle'){ty=HANDLE_VIEW_Y;tx=-.07}if(v==='top'){ty=LEFT_SIDE_VIEW_Y;tx=.68}});
$('spin').onclick=()=>{spinning=!spinning;$('spin').setAttribute('aria-pressed',String(spinning))};
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
$('downloadView').onclick=()=>download(canvas.toDataURL('image/png'),'custom-mug-view.png');
async function renderView(x,y){mug.rotation.x=x;mug.rotation.y=y;r.render(s,cam);await new Promise(requestAnimationFrame);return canvas.toDataURL('image/png')}
async function saveProof(){if(!fimg&&!bimg)return;const sx=mug.rotation.x,sy=mug.rotation.y;const left=await renderView(-.08,LEFT_SIDE_VIEW_Y);const right=await renderView(-.08,RIGHT_SIDE_VIEW_Y);mug.rotation.x=sx;mug.rotation.y=sy;const proof=document.createElement('canvas');proof.width=1800;proof.height=1100;const x=proof.getContext('2d');x.fillStyle='#f8fafc';x.fillRect(0,0,proof.width,proof.height);x.fillStyle='#111827';x.font='700 54px Arial';x.fillText('Custom 11oz mug proof',70,90);x.font='28px Arial';x.fillStyle='#475467';x.fillText('Left and right side views only',70,132);x.fillText('Production file: '+(productionFile?.name||'not selected'),70,172);const li=await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src=left});const ri=await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src=right});x.fillStyle='#fff';x.strokeStyle='#d0d5dd';x.lineWidth=3;[[70,230],[930,230]].forEach(([px,py])=>{x.fillRect(px,py,800,720);x.strokeRect(px,py,800,720)});x.drawImage(li,100,260,740,560);x.drawImage(ri,960,260,740,560);x.fillStyle='#111827';x.font='700 34px Arial';x.fillText('Left side',100,900);x.fillText('Right side',960,900);x.font='24px Arial';x.fillStyle='#667085';x.fillText('Artwork can be scaled and moved inside the printable side area before saving.',100,970);proofUrl=proof.toDataURL('image/png');$('proofImg').src=proofUrl;$('proofWrap').classList.remove('hidden');download(proofUrl,'custom-mug-2d-proof.png')}
$('saveProof').onclick=saveProof;
$('downloadProof').onclick=()=>{if(proofUrl)download(proofUrl,'custom-mug-2d-proof.png')};
function shots(){if(!fimg&&!bimg)return;const sx=mug.rotation.x,sy=mug.rotation.y,views=[['Left side',-.08,LEFT_SIDE_VIEW_Y],['Right side',-.08,RIGHT_SIDE_VIEW_Y],['Handle side',-.07,HANDLE_VIEW_Y],['Top',.68,LEFT_SIDE_VIEW_Y]];$('shots').innerHTML='';for(const [n,x,y] of views){mug.rotation.x=x;mug.rotation.y=y;r.render(s,cam);const box=document.createElement('div');box.className='shot';const im=document.createElement('img');const url=canvas.toDataURL('image/jpeg',.92);im.src=url;const d=document.createElement('div');const span=document.createElement('span');span.textContent=n;const btn=document.createElement('button');btn.textContent='Save';btn.onclick=()=>download(url,'custom-mug-'+n.toLowerCase().replaceAll(' ','-')+'.jpg');d.append(span,btn);box.append(im,d);$('shots').append(box)}mug.rotation.x=sx;mug.rotation.y=sy}
$('refresh').onclick=shots;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
function loop(){requestAnimationFrame(loop);if(document.hidden)return;if(spinning)ty+=.011;mug.rotation.y+=(ty-mug.rotation.y)*.14;mug.rotation.x+=(tx-mug.rotation.x)*.14;// Shift lookAt so the handle (at local x=2.06) stays in frame at all rotations
const hx=Math.cos(mug.rotation.y)*0.42;cam.lookAt(hx,.05,0);try{r.render(s,cam)}catch(_){}}
build();redraw();loop();
